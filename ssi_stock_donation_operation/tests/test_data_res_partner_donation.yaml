scenarios:
  - name: "Create Partner with Donation Location Fields"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Donation Partner"
      - step: "Assert partner created"
        action: "assert"
        target: "partner"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Donation Partner"

  - name: "Edit Partner Name"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Donation Partner Edit"
      - step: "Update partner name"
        action: "write"
        target: "partner"
        values:
          name: "Updated Donation Partner"
      - step: "Assert name updated"
        action: "assert"
        target: "partner"
        asserts:
          name:
            type: "value"
            expected: "Updated Donation Partner"
