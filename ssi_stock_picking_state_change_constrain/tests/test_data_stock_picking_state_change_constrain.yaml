scenarios:
  - name: "Create Stock Picking with State Change Constrain Mixin"
    steps:
      - step: "Get goods receipt picking type"
        action: "search"
        model: "stock.picking.type"
        domain: [["code", "=", "incoming"]]
        save_as: "picking_type"
        limit: 1
      - step: "Get supplier location"
        action: "search"
        model: "stock.location"
        domain: [["usage", "=", "supplier"]]
        save_as: "src_location"
        limit: 1
      - step: "Get internal stock location"
        action: "search"
        model: "stock.location"
        domain: [["usage", "=", "internal"]]
        save_as: "dest_location"
        limit: 1
      - step: "Create stock picking"
        action: "create"
        model: "stock.picking"
        save_as: "picking"
        values:
          picking_type_id: "EVAL: registry['picking_type'].id"
          location_id: "EVAL: registry['src_location'].id"
          location_dest_id: "EVAL: registry['dest_location'].id"
      - step: "Assert picking created in draft state"
        action: "assert"
        target: "picking"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
